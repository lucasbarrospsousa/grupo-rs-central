plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'br.com.sideracode.whatsappgateway'
 compileSdk 35
 defaultConfig { applicationId 'br.com.sideracode.whatsappgateway'; minSdk 26; targetSdk 34; versionCode 6; versionName '1.4.0' }
 sourceSets { main { manifest.srcFile '../AndroidManifest.xml'; java.srcDirs = ['../src']; res.srcDirs = ['../res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1'; testImplementation 'junit:junit:4.13.2' }
